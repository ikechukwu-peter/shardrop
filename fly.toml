# Relay deployment: fly launch --no-deploy, then fly deploy
app = "shardrop-relay"
primary_region = "lhr"

[build]
  dockerfile = "server/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
